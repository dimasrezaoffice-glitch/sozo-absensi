<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOZO Dental Attendance</title>
<style>
:root{--p:#0b7285;--p2:#15aabf;--bg:#f3f6f9;--tx:#14232f;--mu:#6b7c8c;--ln:#e4eaf0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:84px}
small{color:var(--mu)}
header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center;padding:9px 14px}
.brand{display:flex;gap:10px;align-items:center;font-weight:700;color:var(--p);line-height:1.15}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--p),var(--p2));display:grid;place-items:center;box-shadow:0 4px 12px rgba(11,114,133,.3)}
.av{width:34px;height:34px;border-radius:50%;background:#e3f4f7;color:var(--p);display:grid;place-items:center;font-weight:700}
.nm{display:none;text-align:right;line-height:1.2}.rt{display:flex;gap:10px;align-items:center}
main{max-width:860px;margin:0 auto;padding:16px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;gap:2px;background:#fff;border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom));overflow-x:auto}
nav button{flex:1 0 66px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;color:var(--mu);font-size:11px;padding:6px 4px;border-radius:12px;box-shadow:none}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--p);background:#e3f4f7}nav button:hover{box-shadow:none;background:#f0f6f8}
@media(min-width:760px){body{padding-bottom:0}nav{position:sticky;top:53px;bottom:auto;border:0;border-bottom:1px solid var(--ln);justify-content:center;padding:6px}nav button{flex:0 0 auto;flex-direction:row;font-size:14px;gap:6px;padding:8px 14px}.nm{display:block}}
.card{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,40,60,.04),0 8px 22px rgba(16,40,60,.05);animation:up .4s ease both}
.card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.12s}.card:nth-child(4){animation-delay:.18s}
input,select{width:100%;padding:11px 12px;margin:4px 0 10px;border:1.5px solid var(--ln);border-radius:12px;font:inherit;background:#fff;color:var(--tx);transition:border .2s,box-shadow .2s}
input:focus,select:focus{outline:0;border-color:var(--p2);box-shadow:0 0 0 4px rgba(21,170,191,.15)}
button{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;transition:transform .12s,box-shadow .2s,opacity .2s}
button:hover{box-shadow:0 6px 16px rgba(11,114,133,.28)}button:active{transform:scale(.95)}button:disabled{opacity:.55;pointer-events:none}
button.gray{background:#eef2f6;color:#33475b}button.red{background:linear-gradient(135deg,#dc2626,#f05252)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #eef2f6;animation:up .35s ease both}.row:last-child{border:0}
.row>div:last-child{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:#eef2f6;color:#4a5d70;white-space:nowrap}
.tag.APPROVED,.tag.H{background:#dcfce7;color:#166534}.tag.REJECTED{background:#fee2e2;color:#991b1b}.tag.PENDING,.tag.Belum{background:#fef3c7;color:#92400e}
.hero{text-align:center;background:linear-gradient(160deg,#0b7285,#15aabf);color:#fff;border:0}
.clk{font-size:46px;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums}.dt{opacity:.9}
button.ci{position:relative;width:172px;height:172px;border-radius:50%;margin:20px auto 8px;display:block;font-size:20px;font-weight:800;letter-spacing:1px;background:#fff;color:var(--p);box-shadow:0 12px 32px rgba(0,0,0,.22)}
button.ci::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(255,255,255,.7);animation:pulse 2s infinite}
button.ci.done{background:#dcfce7;color:#166534;opacity:1}button.ci.done::before{display:none}
.lg{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#0b7285,#15aabf 60%,#74c0d0)}
.lgc{width:100%;max-width:380px;background:#fff;border-radius:22px;padding:26px;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:up .5s ease both}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);padding:11px 18px;border-radius:12px;color:#fff;display:none;z-index:99;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:up .25s ease}
#toast.ok{background:#15803d}#toast.bad{background:#b91c1c}
#ld{position:fixed;top:0;left:0;right:0;height:3px;z-index:99;display:none;background:linear-gradient(90deg,var(--p),var(--p2));transform-origin:left;animation:ld 1.1s ease-in-out infinite}
.sk{height:46px;border-radius:12px;margin:8px 0;background:linear-gradient(90deg,#eef2f6 25%,#f8fafb 50%,#eef2f6 75%);background-size:200% 100%;animation:sh 1.2s infinite}
.tw{overflow-x:auto}table.rp{border-collapse:collapse}table.rp td,table.rp th{border:1px solid #aab4c0;padding:3px 6px;white-space:nowrap;font-size:11px;text-align:center}
table.rp td.l,table.rp th.l{text-align:left}.g1{background:#b4c6e7}.h1{background:#8ea9db}.g2{background:#f4b084}.ho{background:#f8cbad}.g3,.hy{background:#ffe699}td.cn{background:#f8cbad;font-weight:700}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{transform:scale(.96);opacity:.9}100%{transform:scale(1.28);opacity:0}}
@keyframes sh{to{background-position:-200% 0}}@keyframes ld{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="ld"></div><div id="toast"></div><div id="app"></div>
<script>
// ====== GANTI BARIS INI dengan URL Web App Apps Script Anda ======
var API='https://script.google.com/macros/s/AKfycbyyRPWzV1fIgVKJGXkwVpE9UULjYZMM8TjLsDii7uTByxnH_fEPgaijlZ9diZm6K6gH/exec';
// =================================================================
var T=localStorage.getItem('tk'),ME=null,M=null;
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m,bad){var t=$('#toast');t.textContent=m;t.className=bad?'bad':'ok';t.style.display='block';t.style.animation='none';t.offsetHeight;t.style.animation='';clearTimeout(window._tt);window._tt=setTimeout(function(){t.style.display='none'},3200)}
function call(a,d){
  d=d||{};d.action=a;d.token=T;$('#ld').style.display='block';
  return fetch(API,{method:'POST',body:JSON.stringify(d)}).then(function(r){return r.json()}).then(function(r){
    $('#ld').style.display='none';
    if(!r.ok){if(r.code==='AUTH'&&a!=='login'){localStorage.removeItem('tk');T=null;showLogin();}throw new Error(r.error)}
    return r.data;
  }).catch(function(e){$('#ld').style.display='none';throw e});
}
function run(p,ok){return p.then(function(x){if(ok)toast(ok);return x}).catch(function(e){toast(e.message==='Failed to fetch'?'Gagal terhubung ke server':e.message,1)})}
var LOGO='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M7 3c-2.5 0-4 2-4 4.5 0 2 1 3 1.5 5 .6 2.5.8 8.5 3 8.5 1.8 0 1.5-4.5 4.5-4.5s2.7 4.5 4.5 4.5c2.2 0 2.4-6 3-8.5.5-2 1.5-3 1.5-5C21 5 19.5 3 17 3c-2 0-2.5 1-5 1S9 3 7 3z"/></svg>';
var SK='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
function showLogin(){
  localStorage.removeItem('c_me');localStorage.removeItem('c_m');
  $('#app').innerHTML='<div class="lg"><div class="lgc"><div class="brand" style="justify-content:center"><div class="logo" style="width:48px;height:48px">'+LOGO+'</div></div><h2 style="text-align:center;margin:8px 0 2px;color:var(--p)">SOZO Dental</h2><p style="text-align:center;margin:0 0 18px;color:var(--mu)">Attendance System</p><small>Email</small><input id="em" type="email" autocomplete="username" inputmode="email"><small>Password</small><input id="pw" type="password" autocomplete="current-password"><button style="width:100%;padding:13px" id="go">Masuk</button></div></div>';
  function go(){var b=$('#go');b.disabled=true;b.textContent='Memproses...';run(call('login',{email:$('#em').value,password:$('#pw').value})).then(function(r){b.disabled=false;b.textContent='Masuk';if(!r)return;T=r.token;localStorage.setItem('tk',T);boot()})}
  $('#go').onclick=go;$('#pw').onkeydown=function(e){if(e.key==='Enter')go()};
}
function boot(){
  if(!T)return showLogin();
  var shown=0;try{var a=JSON.parse(localStorage.getItem('c_me')),b=JSON.parse(localStorage.getItem('c_m'));if(a&&b){ME=a;M=b;shell();shown=1}}catch(e){}
  run(Promise.all([call('me'),call('master')])).then(function(r){
    if(!r)return;var chg=!shown||ME.user_id!==r[0].user_id||ME.role!==r[0].role;ME=r[0];M=r[1];
    localStorage.setItem('c_me',JSON.stringify(ME));localStorage.setItem('c_m',JSON.stringify(M));if(chg)shell();
  });
}
var TABS={Employee:['att','ot','prof'],SPV:['abs','ot','emp','prof'],HR:['rep','abs','emp','master','ot','prof'],SuperAdmin:['rep','abs','emp','master','users','sess','ot','prof']};
var NAMES={att:'Absen',ot:'Lembur',prof:'Profil',emp:'Karyawan',master:'Master',users:'Akun',sess:'Session',rep:'Laporan',abs:'Harian'};
var IC={att:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',ot:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',prof:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',emp:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3.5-5.5 7-5.5s7 2 7 5.5M16 4.5a3.5 3.5 0 0 1 0 7M22 20c0-3-2-4.7-5-5.3"/>',master:'<path d="M4 21V7l8-4 8 4v14M9 21v-6h6v6M9 10h.01M15 10h.01"/>',users:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',sess:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',rep:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',abs:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"/>'};
function shell(){
  var tabs=TABS[ME.role]||['prof'],ini=(ME.full_name||'?').trim().charAt(0).toUpperCase();
  $('#app').innerHTML='<header class="top"><div class="brand"><div class="logo">'+LOGO+'</div><div>SOZO Dental<br><small>Attendance</small></div></div><div class="rt"><div class="nm"><b>'+esc(ME.full_name)+'</b><br><small>'+esc(ME.role)+'</small></div><div class="av">'+esc(ini)+'</div><button class="gray" id="lo">Keluar</button></div></header><nav>'+tabs.map(function(t){return '<button data-t="'+t+'"><svg viewBox="0 0 24 24">'+IC[t]+'</svg><span>'+NAMES[t]+'</span></button>'}).join('')+'</nav><main id="v"></main>';
  $('#lo').onclick=function(){call('logout').catch(function(){}).then(function(){localStorage.removeItem('tk');localStorage.removeItem('c_me');localStorage.removeItem('c_m');T=null;showLogin()})};
  document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){open(b.dataset.t)}});
  open(tabs[0]);
}
function open(t){
  document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});
  $('#v').innerHTML='';scrollTo(0,0);V[t]();
}
function opts(a,id,nm){return a.map(function(x){return '<option value="'+esc(x[id])+'">'+esc(x[nm])+'</option>'}).join('')}
var V={
att:function(){
  var p=function(n){return ('0'+n).slice(-2)},ts=function(){var t=new Date();return t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate())};
  var DY=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],MN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  $('#v').innerHTML='<div class="card hero"><div class="clk" id="ck">--:--:--</div><div class="dt" id="cd"></div><button class="ci" id="ci" disabled>...</button><div id="cs" style="min-height:22px"></div></div><div class="card"><b>Riwayat Absensi</b><div id="hl">'+SK+'</div></div>';
  function tick(){if(!$('#ck'))return clearInterval(window._tk);var t=new Date();$('#ck').textContent=p(t.getHours())+':'+p(t.getMinutes())+':'+p(t.getSeconds());$('#cd').textContent=DY[t.getDay()]+', '+t.getDate()+' '+MN[t.getMonth()]+' '+t.getFullYear()}
  tick();clearInterval(window._tk);window._tk=setInterval(tick,1000);
  function load(){run(call('history')).then(function(r){if(!r)return;
    var d0=r.att[0],done=!!(d0&&d0.date===ts()),b=$('#ci');if(!b)return;
    b.classList.toggle('done',done);b.textContent=done?'✓ SUDAH':'CLOCK IN';b.disabled=done;
    $('#cs').textContent=done?'Clock In hari ini pukul '+d0.time.slice(0,5)+' (H)':'Belum Clock In hari ini';
    $('#hl').innerHTML=r.att.map(function(a){return '<div class="row"><span>'+esc(a.date)+' <small>'+esc(a.time.slice(0,5))+'</small></span><span class="tag '+esc(a.code)+'">'+esc(a.code)+'</span></div>'}).join('')||'<small>Belum ada data</small>';
  })}
  $('#ci').onclick=function(){var b=$('#ci');b.disabled=true;b.textContent='...';run(call('clockIn'),'Clock In berhasil ✓').then(load)};
  load();
},
ot:function(){
  var emp=ME.role==='Employee';
  $('#v').innerHTML=(emp?'<div class="card"><b>Ajukan Lembur</b><input id="od" type="date"><input id="oh" type="number" step="0.5" placeholder="Durasi (jam)"><input id="on" placeholder="Keterangan"><button id="os">Kirim</button></div>':'')+'<div class="card"><b>Menunggu Persetujuan</b><div id="op">\'+SK+\'</div></div><div class="card"><b>Riwayat Lembur</b><div id="ol">\'+SK+\'</div></div>';
  function ln(o){var act=(ME.role==='SPV'&&o.status==='PENDING')?'<div><button data-i="'+o.ot_id+'" data-d="APPROVED">Setujui</button> <button class="red" data-i="'+o.ot_id+'" data-d="REJECTED">Tolak</button></div>':'';
    return '<div class="row"><div>'+esc(o.name)+'<br><small>'+esc(o.date)+' · '+esc(o.hours)+' jam · '+esc(o.note)+'</small></div><div><span class="tag '+esc(o.status)+'">'+esc(o.status)+'</span>'+act+'</div></div>'}
  function load(){run(call('otList')).then(function(r){if(!r)return;
    $('#op').innerHTML=r.filter(function(o){return o.status==='PENDING'}).map(ln).join('')||'<small>Tidak ada</small>';
    $('#ol').innerHTML=r.filter(function(o){return o.status!=='PENDING'}).map(ln).join('')||'<small>Kosong</small>';
    document.querySelectorAll('#op button').forEach(function(b){b.onclick=function(){var n=prompt('Catatan (boleh kosong)');if(n===null)return;run(call('otDecide',{ot_id:b.dataset.i,decision:b.dataset.d,note:n}),'Tersimpan').then(load)}});
  })}
  if(emp)$('#os').onclick=function(){run(call('otRequest',{date:$('#od').value,hours:$('#oh').value,note:$('#on').value}),'Pengajuan terkirim').then(load)};
  load();
},
prof:function(){
  $('#v').innerHTML='<div class="card"><div class="row"><span>Nama</span><b>'+esc(ME.full_name)+'</b></div><div class="row"><span>Email</span><b>'+esc(ME.email)+'</b></div><div class="row"><span>Role</span><b>'+esc(ME.role)+'</b></div><div class="row"><span>ID</span><b>'+esc(ME.employee_id||'-')+'</b></div><div class="row"><span>Jabatan</span><b>'+esc(ME.position||'-')+'</b></div><div class="row"><span>Homebase</span><b>'+esc(ME.branch||'-')+'</b></div></div><div class="card"><b>Ganti Password</b><input id="po" type="password" placeholder="Password lama"><input id="pn" type="password" placeholder="Password baru (min 8)"><button id="ps">Simpan</button></div>';
  $('#ps').onclick=function(){run(call('changePassword',{old:$('#po').value,pw:$('#pn').value})).then(function(r){if(r){alert('Password diganti. Silakan login lagi.');localStorage.removeItem('tk');T=null;showLogin()}})};
},
emp:function(){
  var ed=null,L=[];
  $('#v').innerHTML='<div class="card"><b id="ft">Tambah Karyawan</b><input id="fi" placeholder="ID Karyawan (contoh: PBJ252216)" style="text-transform:uppercase"><input id="fn" placeholder="Nama lengkap"><input id="fe" type="email" placeholder="Email pribadi"><input id="fp" placeholder="Password awal (min 8, beda tiap orang)"><select id="fj">'+opts(M.positions,'position_id','name')+'</select><select id="fb">'+opts(M.branches,'branch_id','name')+'</select><button id="fs">Simpan</button> <button id="fc" class="gray" style="display:none">Batal</button></div><div class="card"><b>Daftar Karyawan</b><div id="el">\'+SK+\'</div></div>';
  function clr(){ed=null;$('#fi').value=$('#fn').value=$('#fe').value=$('#fp').value='';$('#fp').style.display='';$('#ft').textContent='Tambah Karyawan';$('#fc').style.display='none'}
  function load(){run(call('employees')).then(function(r){if(!r)return;L=r;
    $('#el').innerHTML=r.map(function(e,i){return '<div class="row"><div>'+esc(e.full_name)+(e.active==='Y'?'':' <span class="tag">nonaktif</span>')+'<br><small>'+esc(e.employee_id)+' · '+esc(e.email)+' · '+esc(e.position)+' · '+esc(e.branch)+'</small></div><div><button data-k="e" data-i="'+i+'">Edit</button> <button class="gray" data-k="p" data-i="'+i+'">Reset PW</button> <button class="'+(e.active==='Y'?'red':'')+'" data-k="a" data-i="'+i+'">'+(e.active==='Y'?'Nonaktifkan':'Aktifkan')+'</button></div></div>'}).join('')||'<small>Kosong</small>';
    document.querySelectorAll('#el button').forEach(function(b){b.onclick=function(){var e=L[b.dataset.i],k=b.dataset.k;
      if(k==='e'){ed=e.employee_id;$('#fi').value=e.employee_id;$('#fn').value=e.full_name;$('#fe').value=e.email;$('#fj').value=e.position_id;$('#fb').value=e.branch_id;$('#fp').style.display='none';$('#ft').textContent='Edit: '+e.full_name;$('#fc').style.display='';scrollTo(0,0)}
      else if(k==='p'){var p=prompt('Password baru untuk '+e.full_name+' (min 8 karakter)');if(p)run(call('resetPassword',{employee_id:e.employee_id,pw:p}),'Password direset')}
      else run(call('setActive',{employee_id:e.employee_id,active:e.active==='Y'?'N':'Y'}),'Diperbarui').then(load)}});
  })}
  $('#fc').onclick=clr;
  $('#fs').onclick=function(){var d={full_name:$('#fn').value,email:$('#fe').value,position_id:$('#fj').value,branch_id:$('#fb').value};
    if(ed){d.employee_id=ed;d.new_id=$('#fi').value;run(call('updateEmployee',d),'Data disimpan').then(function(r){if(r){clr();load()}})}
    else{d.employee_id=$('#fi').value;d.password=$('#fp').value;run(call('addEmployee',d),'Karyawan ditambahkan').then(function(r){if(r){clr();load()}})}};
  load();
},
master:function(){
  function rw(id,k,n){return '<div class="row">'+esc(n)+'<button class="gray" data-k="'+k+'" data-i="'+esc(id)+'" data-n="'+esc(n)+'">Ubah nama</button></div>'}
  $('#v').innerHTML='<div class="card"><b>Cabang</b><input id="bn" placeholder="Nama cabang baru"><button id="bs">Tambah Cabang</button><div>'+M.branches.map(function(b){return rw(b.branch_id,'rb',b.name)}).join('')+'</div></div><div class="card"><b>Jabatan</b><input id="pn" placeholder="Nama jabatan baru"><button id="ps">Tambah Jabatan</button><div>'+M.positions.map(function(b){return rw(b.position_id,'rp',b.name)}).join('')+'</div></div><div class="card"><b>Kode Absensi</b><br><small>H = Hadir (otomatis). Isi arti kode lain sesuai aturan SOZO.</small><input id="cc" placeholder="Kode baru, contoh: CT"><input id="cm" placeholder="Arti kode"><button id="cs">Simpan Kode</button><div>'+M.codes.map(function(c){return '<div class="row"><div><b>'+esc(c.code)+'</b> '+esc(c.meaning)+(c.active==='Y'?'':' <span class="tag">nonaktif</span>')+'</div>'+(c.code==='H'?'':'<div><button class="gray" data-k="cm" data-c="'+esc(c.code)+'" data-n="'+esc(c.meaning)+'" data-a="'+c.active+'">Ubah arti</button> <button class="gray" data-k="ca" data-c="'+esc(c.code)+'" data-n="'+esc(c.meaning)+'" data-a="'+c.active+'">'+(c.active==='Y'?'Matikan':'Aktifkan')+'</button></div>')+'</div>'}).join('')+'</div></div>';
  function re(){call('master').then(function(m){M=m;V.master()})}
  $('#bs').onclick=function(){run(call('addBranch',{name:$('#bn').value}),'Cabang ditambahkan').then(re)};
  $('#ps').onclick=function(){run(call('addPosition',{name:$('#pn').value}),'Jabatan ditambahkan').then(re)};
  $('#cs').onclick=function(){run(call('setCode',{code:$('#cc').value,meaning:$('#cm').value,active:'Y'}),'Kode disimpan').then(re)};

    if(k==='rb'||k==='rp'){n=prompt('Nama baru',b.dataset.n);if(n)run(call(k==='rb'?'renameBranch':'renamePosition',{id:b.dataset.i,name:n}),'Diubah').then(re)}
    else if(k==='cm'){n=prompt('Arti kode '+b.dataset.c,b.dataset.n);if(n!==null)run(call('setCode',{code:b.dataset.c,meaning:n,active:b.dataset.a}),'Disimpan').then(re)}
    else run(call('setCode',{code:b.dataset.c,meaning:b.dataset.n,active:b.dataset.a==='Y'?'N':'Y'}),'Diperbarui').then(re)}});
},
users:function(){

  function bn(id){var b=M.branches.filter(function(y){return y.branch_id===id})[0];return b?b.name:id}
  function load(){run(call('users')).then(function(r){if(!r)return;U=r.filter(function(x){return x.role!=='Employee'});

    document.querySelectorAll('#ul button').forEach(function(b){b.onclick=function(){var x=U[b.dataset.i],k=b.dataset.k;
      if(k==='b'){$('#bp').innerHTML='<hr><b>Cabang untuk '+esc(x.full_name)+'</b><select id="bsel" multiple size="5">'+M.branches.map(function(c){return '<option value="'+esc(c.branch_id)+'"'+(x.branches.indexOf(c.branch_id)>=0?' selected':'')+'>'+esc(c.name)+'</option>'}).join('')+'</select><button id="bsv">Simpan Cabang</button>';
        $('#bsv').onclick=function(){run(call('setSpvBranches',{user_id:x.user_id,branches:[].slice.call($('#bsel').selectedOptions).map(function(o){return o.value})}),'Cabang disimpan').then(function(){$('#bp').innerHTML='';load()})}}
      else if(k==='p'){var p=prompt('Password baru untuk '+x.full_name+' (min 8 karakter)');if(p)run(call('resetPassword',{user_id:x.user_id,pw:p}),'Password direset')}
      else run(call('setUserActive',{user_id:x.user_id,active:x.active==='Y'?'N':'Y'}),'Diperbarui').then(load)}});
  })}
  $('#us').onclick=function(){run(call('addUser',{full_name:$('#un').value,email:$('#ue').value,password:$('#up').value,role:$('#ur').value,branches:[].slice.call($('#ub').selectedOptions).map(function(o){return o.value})}),'Akun dibuat').then(load)};
  load();
},
abs:function(){
  var p=function(n){return ('0'+n).slice(-2)},t=new Date(),td=t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate()),first=1;
  var cs=M.codes.filter(function(c){return c.active==='Y'&&c.code!=='H'});
  $('#v').innerHTML='<div class="card"><b>Absensi Harian</b><input id="ad" type="date" value="'+td+'"><button id="ab">Lihat</button><p id="as"></p><div id="al">\'+SK+\'</div></div><div class="card"><b>Isi Kode Ketidakhadiran</b><br><small>Untuk karyawan yang tidak Clock In (cuti, sakit, dll). Arti kode diatur di menu Cabang &amp; Jabatan.</small><select id="le"></select><input id="lt" type="date" value="'+td+'"><select id="lc">'+cs.map(function(c){return '<option value="'+esc(c.code)+'">'+esc(c.code)+(c.meaning?' - '+esc(c.meaning):'')+'</option>'}).join('')+'</select><input id="ln" placeholder="Catatan (boleh kosong)"><button id="lv">Simpan Kode</button> <button class="red" id="lx">Hapus Kode di Tanggal Itu</button></div>';
  function load(){run(call('attDay',{date:$('#ad').value})).then(function(r){if(!r)return;var c={};
    r.rows.forEach(function(x){var k=x.code||'Belum';c[k]=(c[k]||0)+1});
    $('#as').innerHTML=Object.keys(c).map(function(k){return '<span class="tag">'+esc(k)+': '+c[k]+'</span>'}).join(' ')+' <small>dari '+r.rows.length+' karyawan aktif</small>';
    $('#al').innerHTML=r.rows.map(function(x){return '<div class="row"><div>'+esc(x.full_name)+'<br><small>'+esc(x.branch)+(x.time?' · '+esc(x.time):'')+'</small></div><span class="tag '+esc(x.code||'Belum')+'">'+esc(x.code||'Belum')+'</span></div>'}).join('')||'<small>Belum ada karyawan</small>';
    if(first){first=0;$('#le').innerHTML=opts(r.rows,'employee_id','full_name')}
  })}
  function lv(code){run(call('addLeave',{employee_id:$('#le').value,date:$('#lt').value,code:code,note:$('#ln').value}),'Tersimpan').then(load)}
  $('#ab').onclick=load;$('#lv').onclick=function(){lv($('#lc').value)};$('#lx').onclick=function(){lv('')};
  load();
},
rep:function(){
  var t=new Date(),p=function(n){return ('0'+n).slice(-2)},td=t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate()),R=null,L={};
  $('#v').innerHTML='<div class="card"><b>Filter Laporan</b><small style="display:block;margin-top:8px">Dari</small><input id="rf" type="date" value="'+td.slice(0,8)+'01"><small>Sampai</small><input id="rt" type="date" value="'+td+'"><small>Cabang (kosong = semua; bisa pilih banyak)</small><select id="rb" multiple size="4">'+opts(M.branches,'branch_id','name')+'</select><select id="rp"><option value="">Semua jabatan</option>'+opts(M.positions,'position_id','name')+'</select><select id="re"><option value="">Semua karyawan</option></select><button id="rs">Tampilkan</button> <button id="rx" class="gray">Excel</button> <button id="rd" class="gray">PDF</button></div><div class="card tw" id="rv"><small>Tekan Tampilkan</small></div>';
  run(call('employees')).then(function(r){if(r)$('#re').innerHTML+=opts(r,'employee_id','full_name')});
  function lib(u){return L[u]||(L[u]=new Promise(function(ok,no){var s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=function(){delete L[u];no(new Error('Gagal memuat pustaka export (cek internet)'))};document.head.appendChild(s)}))}
  function tb(){var n=R.dates.length,K=R.codes.length;return {n:n,K:K,dy:R.dates.map(function(x){return String(Number(x.slice(8)))}),body:R.rows.map(function(r){return [r.homebase,r.employee_id,r.name,r.position].concat(r.att,r.counts,r.ot,[r.total])})}}
  function fn(e){return 'Absensi_SOZO_'+$('#rf').value+'_sd_'+$('#rt').value+'.'+e}
  function ok(){if(R&&R.rows.length)return 1;toast('Tampilkan laporan dulu (data harus ada)',1);return 0}
  var FX=['Homebase','Employee ID*','Full Name','Jabatan'];
  $('#rs').onclick=function(){run(call('report',{from:$('#rf').value,to:$('#rt').value,branches:[].slice.call($('#rb').selectedOptions).map(function(o){return o.value}),position_id:$('#rp').value,employee_id:$('#re').value})).then(function(r){
    if(!r)return;R=r;if(!r.rows.length){$('#rv').innerHTML='<small>Tidak ada karyawan sesuai filter</small>';return}
    var x=tb(),h='<table class="rp"><tr><th class="g1 l" colspan="4">Keterangan</th><th class="g2 l" colspan="'+(x.n+x.K)+'">Hari Kerja</th><th class="g3 l" colspan="'+(x.n+1)+'">Overtime</th></tr><tr>'+FX.map(function(c){return '<th class="h1 l">'+c+'</th>'}).join('')+x.dy.map(function(d){return '<th class="ho">'+d+'</th>'}).join('')+R.codes.map(function(c){return '<th class="ho">'+esc(c)+'</th>'}).join('')+x.dy.map(function(d){return '<th class="hy">'+d+'</th>'}).join('')+'<th class="ho">OT</th></tr>';
    x.body.forEach(function(r){h+='<tr>'+r.map(function(c,i){return '<td class="'+(i<4?'l':(i>=4+x.n&&i<4+x.n+x.K)||i===r.length-1?'cn':'')+'">'+esc(c)+'</td>'}).join('')+'</tr>'});
    $('#rv').innerHTML=h+'</table>';})};
  $('#rx').onclick=function(){if(!ok())return;run(lib('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js')).then(function(){
    if(!window.ExcelJS)return;var x=tb(),tot=4+2*x.n+x.K+1,wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Absensi');
    var r1=Array(tot).fill('');r1[0]='Keterangan';r1[4]='Hari Kerja';r1[4+x.n+x.K]='Overtime';
    ws.addRow(r1);ws.addRow(FX.concat(x.dy,R.codes,x.dy,['OT']));x.body.forEach(function(r){ws.addRow(r)});
    ws.mergeCells(1,1,1,4);ws.mergeCells(1,5,1,4+x.n+x.K);ws.mergeCells(1,5+x.n+x.K,1,tot);
    function fl(c,hex){c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF'+hex}}}
    var bd={style:'thin',color:{argb:'FF808080'}};
    ws.eachRow(function(row,ri){row.eachCell({includeEmpty:true},function(c,ci){
      c.border={top:bd,left:bd,bottom:bd,right:bd};c.font={size:ri<3?10:9,bold:ri===2||(ri>2&&((ci>4+x.n&&ci<=4+x.n+x.K)||ci===tot))};
      c.alignment={horizontal:ci<=4?'left':'center',vertical:'middle'};
      if(ri===1)fl(c,ci<=4?'B4C6E7':ci<=4+x.n+x.K?'F4B084':'FFE699');
      else if(ri===2)fl(c,ci<=4?'8EA9DB':(ci>4+x.n+x.K&&ci<tot)?'FFE699':'F8CBAD');
      else if((ci>4+x.n&&ci<=4+x.n+x.K)||ci===tot)fl(c,'F8CBAD');
    })});
    [26,14,34,16].forEach(function(w,i){ws.getColumn(i+1).width=w});for(var i=5;i<=tot;i++)ws.getColumn(i).width=4.8;
    return wb.xlsx.writeBuffer().then(function(buf){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download=fn('xlsx');a.click();toast('Excel diunduh')})})};
  $('#rd').onclick=function(){if(!ok())return;run(lib('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js').then(function(){return lib('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js')})).then(function(){
    if(!window.jspdf)return;var x=tb(),d=new window.jspdf.jsPDF({orientation:'landscape',format:x.n<=12?'a4':x.n<=31?'a3':'a2'}),B=[180,198,231],B2=[142,169,219],O=[244,176,132],O2=[248,203,173],Y=[255,230,153];
    function c(t,col,sp){var o={content:String(t),styles:{fillColor:col,textColor:0,fontStyle:'normal',halign:'center'}};if(sp)o.colSpan=sp;return o}
    var h1=[c('Keterangan',B,4),c('Hari Kerja',O,x.n+x.K),c('Overtime',Y,x.n+1)],h2=FX.map(function(t){return c(t,B2)}).concat(x.dy.map(function(t){return c(t,O2)}),R.codes.map(function(t){return c(t,O2)}),x.dy.map(function(t){return c(t,Y)}),[c('OT',O2)]);
    h1.forEach(function(o,i){if(i===0)o.styles.halign='left'});
    d.autoTable({startY:12,margin:8,theme:'grid',styles:{fontSize:6.5,cellPadding:1,textColor:0,lineColor:[120,120,120],lineWidth:.1,halign:'center'},head:[h1,h2],body:x.body,
      columnStyles:{0:{halign:'left'},1:{halign:'left'},2:{halign:'left'},3:{halign:'left'}},
      didParseCell:function(e){if(e.section==='body'){var i=e.column.index;if((i>=4+x.n&&i<4+x.n+x.K)||i===4+2*x.n+x.K){e.cell.styles.fillColor=O2;e.cell.styles.fontStyle='bold'}}}});
    d.save(fn('pdf'));toast('PDF diunduh')})};
},
