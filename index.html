<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOZO Dental Attendance</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:#f5f7fa;color:#1d2b3a}
header{background:#fff;border-bottom:1px solid #e3e8ee;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:17px;margin:0;color:#0b6e8a}main{max-width:760px;margin:0 auto;padding:14px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:#fff;border-bottom:1px solid #e3e8ee}
nav button{white-space:nowrap;background:#eef2f6;color:#1d2b3a}nav button.on{background:#0b6e8a;color:#fff}
.card{background:#fff;border:1px solid #e3e8ee;border-radius:12px;padding:14px;margin-bottom:12px}
input,select{width:100%;padding:10px;margin:4px 0 10px;border:1px solid #cfd8e3;border-radius:8px;font:inherit}
button{background:#0b6e8a;color:#fff;border:0;border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer}
button.big{width:100%;padding:22px;font-size:20px;font-weight:700}button.red{background:#c0392b}button.gray{background:#8793a1}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #eef2f6;align-items:center}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:#eef2f6}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);padding:10px 16px;border-radius:8px;color:#fff;display:none;z-index:9}
#ld{position:fixed;top:0;left:0;right:0;height:3px;background:#0b6e8a;display:none}
small{color:#6b7a8a}
table.rp td,table.rp th{border:1px solid #cfd8e3;padding:3px 5px;white-space:nowrap;font-size:11px}table.rp th{background:#eef2f6}
</style></head><body>
<div id="ld"></div><div id="toast"></div><div id="app"></div>
<script>
// ====== GANTI BARIS INI dengan URL Web App Apps Script Anda ======
var API='https://script.google.com/macros/s/AKfycbyyRPWzV1fIgVKJGXkwVpE9UULjYZMM8TjLsDii7uTByxnH_fEPgaijlZ9diZm6K6gH/exec';
// =================================================================
var T=localStorage.getItem('tk'),ME=null,M=null;
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m,bad){var t=$('#toast');t.textContent=m;t.style.background=bad?'#c0392b':'#1e8e5a';t.style.display='block';setTimeout(function(){t.style.display='none'},3200)}
function call(a,d){
  d=d||{};d.action=a;d.token=T;$('#ld').style.display='block';
  return fetch(API,{method:'POST',body:JSON.stringify(d)}).then(function(r){return r.json()}).then(function(r){
    $('#ld').style.display='none';
    if(!r.ok){if(r.code==='AUTH'&&a!=='login'){localStorage.removeItem('tk');T=null;showLogin();}throw new Error(r.error)}
    return r.data;
  }).catch(function(e){$('#ld').style.display='none';throw e});
}
function run(p,ok){return p.then(function(x){if(ok)toast(ok);return x}).catch(function(e){toast(e.message==='Failed to fetch'?'Gagal terhubung ke server':e.message,1)})}
function showLogin(){
  $('#app').innerHTML='<main><div class="card" style="margin-top:12vh"><h1>SOZO Dental Attendance</h1><br><label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><button style="width:100%" id="go">Masuk</button><p><small>Login tersimpan permanen di perangkat ini sampai Anda Keluar.</small></p></div></main>';
  $('#go').onclick=function(){run(call('login',{email:$('#em').value,password:$('#pw').value})).then(function(r){if(!r)return;T=r.token;localStorage.setItem('tk',T);boot()})};
}
function boot(){
  if(!T)return showLogin();
  run(Promise.all([call('me'),call('master')])).then(function(r){
    if(!r)return;ME=r[0];M=r[1];shell();
  });
}
var TABS={Employee:['att','ot','prof'],SPV:['abs','ot','emp','prof'],HR:['rep','abs','emp','master','ot','prof'],SuperAdmin:['rep','abs','emp','master','users','sess','ot','prof']};
var NAMES={att:'Absen',ot:'Lembur',prof:'Profil',emp:'Karyawan',master:'Cabang & Jabatan',users:'Akun HR/SPV',sess:'Session',rep:'Laporan',abs:'Absensi Harian'};
function shell(){
  var tabs=TABS[ME.role]||['prof'];
  $('#app').innerHTML='<header><h1>SOZO Dental</h1><span><small>'+esc(ME.full_name)+' ('+esc(ME.role)+')</small> <button class="gray" id="lo">Keluar</button></span></header><nav>'+tabs.map(function(t){return '<button data-t="'+t+'">'+NAMES[t]+'</button>'}).join('')+'</nav><main id="v"></main>';
  $('#lo').onclick=function(){call('logout').catch(function(){}).then(function(){localStorage.removeItem('tk');T=null;showLogin()})};
  document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){open(b.dataset.t)}});
  open(tabs[0]);
}
function open(t){
  document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});
  $('#v').innerHTML='';V[t]();
}
function opts(a,id,nm){return a.map(function(x){return '<option value="'+esc(x[id])+'">'+esc(x[nm])+'</option>'}).join('')}
var V={
att:function(){
  $('#v').innerHTML='<div class="card"><button class="big" id="ci">CLOCK IN</button><p><small>Waktu diambil dari server. Hanya bisa 1x per hari.</small></p></div><div class="card"><b>Riwayat</b><div id="hl"></div></div>';
  function load(){run(call('history')).then(function(r){if(r)$('#hl').innerHTML=r.att.map(function(a){return '<div class="row"><span>'+esc(a.date)+' '+esc(a.time)+'</span><span class="tag">'+esc(a.code)+'</span></div>'}).join('')||'<small>Belum ada data</small>'})}
  $('#ci').onclick=function(){run(call('clockIn'),'Clock In berhasil (H)').then(load)};load();
},
ot:function(){
  var emp=ME.role==='Employee';
  $('#v').innerHTML=(emp?'<div class="card"><b>Ajukan Lembur</b><input id="od" type="date"><input id="oh" type="number" step="0.5" placeholder="Durasi (jam)"><input id="on" placeholder="Keterangan"><button id="os">Kirim</button></div>':'')+'<div class="card"><b>Menunggu Persetujuan</b><div id="op"></div></div><div class="card"><b>Riwayat Lembur</b><div id="ol"></div></div>';
  function ln(o){var act=(ME.role==='SPV'&&o.status==='PENDING')?'<div><button data-i="'+o.ot_id+'" data-d="APPROVED">Setujui</button> <button class="red" data-i="'+o.ot_id+'" data-d="REJECTED">Tolak</button></div>':'';
    return '<div class="row"><div>'+esc(o.name)+'<br><small>'+esc(o.date)+' · '+esc(o.hours)+' jam · '+esc(o.note)+'</small></div><div><span class="tag">'+esc(o.status)+'</span>'+act+'</div></div>'}
  function load(){run(call('otList')).then(function(r){if(!r)return;
    $('#op').innerHTML=r.filter(function(o){return o.status==='PENDING'}).map(ln).join('')||'<small>Tidak ada</small>';
    $('#ol').innerHTML=r.filter(function(o){return o.status!=='PENDING'}).map(ln).join('')||'<small>Kosong</small>';
    document.querySelectorAll('#op button').forEach(function(b){b.onclick=function(){var n=prompt('Catatan (boleh kosong)');if(n===null)return;run(call('otDecide',{ot_id:b.dataset.i,decision:b.dataset.d,note:n}),'Tersimpan').then(load)}});
  })}
  if(emp)$('#os').onclick=function(){run(call('otRequest',{date:$('#od').value,hours:$('#oh').value,note:$('#on').value}),'Pengajuan terkirim').then(load)};
  load();
},
prof:function(){
  $('#v').innerHTML='<div class="card"><div class="row"><span>Nama</span><b>'+esc(ME.full_name)+'</b></div><div class="row"><span>Email</span><b>'+esc(ME.email)+'</b></div><div class="row"><span>Role</span><b>'+esc(ME.role)+'</b></div><div class="row"><span>ID</span><b>'+esc(ME.employee_id||'-')+'</b></div><div class="row"><span>Jabatan</span><b>'+esc(ME.position||'-')+'</b></div><div class="row"><span>Homebase</span><b>'+esc(ME.branch||'-')+'</b></div></div><div class="card"><b>Ganti Password</b><input id="po" type="password" placeholder="Password lama"><input id="pn" type="password" placeholder="Password baru (min 8)"><button id="ps">Simpan</button></div>';
  $('#ps').onclick=function(){run(call('changePassword',{old:$('#po').value,pw:$('#pn').value})).then(function(r){if(r){alert('Password diganti. Silakan login lagi.');localStorage.removeItem('tk');T=null;showLogin()}})};
},
emp:function(){
  var ed=null,L=[];
  $('#v').innerHTML='<div class="card"><b id="ft">Tambah Karyawan</b><input id="fn" placeholder="Nama lengkap"><input id="fe" type="email" placeholder="Email pribadi"><input id="fp" placeholder="Password awal (min 8, beda tiap orang)"><select id="fj">'+opts(M.positions,'position_id','name')+'</select><select id="fb">'+opts(M.branches,'branch_id','name')+'</select><button id="fs">Simpan</button> <button id="fc" class="gray" style="display:none">Batal</button></div><div class="card"><b>Daftar Karyawan</b><div id="el"></div></div>';
  function clr(){ed=null;$('#fn').value=$('#fe').value=$('#fp').value='';$('#fp').style.display='';$('#ft').textContent='Tambah Karyawan';$('#fc').style.display='none'}
  function load(){run(call('employees')).then(function(r){if(!r)return;L=r;
    $('#el').innerHTML=r.map(function(e,i){return '<div class="row"><div>'+esc(e.full_name)+(e.active==='Y'?'':' <span class="tag">nonaktif</span>')+'<br><small>'+esc(e.employee_id)+' · '+esc(e.email)+' · '+esc(e.position)+' · '+esc(e.branch)+'</small></div><div><button data-k="e" data-i="'+i+'">Edit</button> <button class="gray" data-k="p" data-i="'+i+'">Reset PW</button> <button class="'+(e.active==='Y'?'red':'')+'" data-k="a" data-i="'+i+'">'+(e.active==='Y'?'Nonaktifkan':'Aktifkan')+'</button></div></div>'}).join('')||'<small>Kosong</small>';
    document.querySelectorAll('#el button').forEach(function(b){b.onclick=function(){var e=L[b.dataset.i],k=b.dataset.k;
      if(k==='e'){ed=e.employee_id;$('#fn').value=e.full_name;$('#fe').value=e.email;$('#fj').value=e.position_id;$('#fb').value=e.branch_id;$('#fp').style.display='none';$('#ft').textContent='Edit: '+e.full_name;$('#fc').style.display='';scrollTo(0,0)}
      else if(k==='p'){var p=prompt('Password baru untuk '+e.full_name+' (min 8 karakter)');if(p)run(call('resetPassword',{employee_id:e.employee_id,pw:p}),'Password direset')}
      else run(call('setActive',{employee_id:e.employee_id,active:e.active==='Y'?'N':'Y'}),'Diperbarui').then(load)}});
  })}
  $('#fc').onclick=clr;
  $('#fs').onclick=function(){var d={full_name:$('#fn').value,email:$('#fe').value,position_id:$('#fj').value,branch_id:$('#fb').value};
    if(ed){d.employee_id=ed;run(call('updateEmployee',d),'Data disimpan').then(function(r){if(r){clr();load()}})}
    else{d.password=$('#fp').value;run(call('addEmployee',d),'Karyawan ditambahkan').then(function(r){if(r){clr();load()}})}};
  load();
},
master:function(){
  function rw(id,k,n){return '<div class="row">'+esc(n)+'<button class="gray" data-k="'+k+'" data-i="'+esc(id)+'" data-n="'+esc(n)+'">Ubah nama</button></div>'}
  $('#v').innerHTML='<div class="card"><b>Cabang</b><input id="bn" placeholder="Nama cabang baru"><button id="bs">Tambah Cabang</button><div>'+M.branches.map(function(b){return rw(b.branch_id,'rb',b.name)}).join('')+'</div></div><div class="card"><b>Jabatan</b><input id="pn" placeholder="Nama jabatan baru"><button id="ps">Tambah Jabatan</button><div>'+M.positions.map(function(b){return rw(b.position_id,'rp',b.name)}).join('')+'</div></div><div class="card"><b>Kode Absensi</b><br><small>H = Hadir (otomatis). Isi arti kode lain sesuai aturan SOZO.</small><input id="cc" placeholder="Kode baru, contoh: CT"><input id="cm" placeholder="Arti kode"><button id="cs">Simpan Kode</button><div>'+M.codes.map(function(c){return '<div class="row"><div><b>'+esc(c.code)+'</b> '+esc(c.meaning)+(c.active==='Y'?'':' <span class="tag">nonaktif</span>')+'</div>'+(c.code==='H'?'':'<div><button class="gray" data-k="cm" data-c="'+esc(c.code)+'" data-n="'+esc(c.meaning)+'" data-a="'+c.active+'">Ubah arti</button> <button class="gray" data-k="ca" data-c="'+esc(c.code)+'" data-n="'+esc(c.meaning)+'" data-a="'+c.active+'">'+(c.active==='Y'?'Matikan':'Aktifkan')+'</button></div>')+'</div>'}).join('')+'</div></div>';
  function re(){call('master').then(function(m){M=m;V.master()})}
  $('#bs').onclick=function(){run(call('addBranch',{name:$('#bn').value}),'Cabang ditambahkan').then(re)};
  $('#ps').onclick=function(){run(call('addPosition',{name:$('#pn').value}),'Jabatan ditambahkan').then(re)};
  $('#cs').onclick=function(){run(call('setCode',{code:$('#cc').value,meaning:$('#cm').value,active:'Y'}),'Kode disimpan').then(re)};
  document.querySelectorAll('#v button[data-k]').forEach(function(b){b.onclick=function(){var k=b.dataset.k,n;
    if(k==='rb'||k==='rp'){n=prompt('Nama baru',b.dataset.n);if(n)run(call(k==='rb'?'renameBranch':'renamePosition',{id:b.dataset.i,name:n}),'Diubah').then(re)}
    else if(k==='cm'){n=prompt('Arti kode '+b.dataset.c,b.dataset.n);if(n!==null)run(call('setCode',{code:b.dataset.c,meaning:n,active:b.dataset.a}),'Disimpan').then(re)}
    else run(call('setCode',{code:b.dataset.c,meaning:b.dataset.n,active:b.dataset.a==='Y'?'N':'Y'}),'Diperbarui').then(re)}});
},
users:function(){
  var U=[];
  $('#v').innerHTML='<div class="card"><b>Tambah HR / SPV</b><input id="un" placeholder="Nama lengkap"><input id="ue" type="email" placeholder="Email"><input id="up" placeholder="Password awal (min 8)"><select id="ur"><option>HR</option><option>SPV</option></select><label><small>Cabang SPV (bisa pilih banyak)</small></label><select id="ub" multiple size="4">'+opts(M.branches,'branch_id','name')+'</select><button id="us">Simpan</button></div><div class="card"><b>Akun HR / SPV / Super Admin</b><div id="ul"></div><div id="bp"></div></div>';
  function bn(id){var b=M.branches.filter(function(y){return y.branch_id===id})[0];return b?b.name:id}
  function load(){run(call('users')).then(function(r){if(!r)return;U=r.filter(function(x){return x.role!=='Employee'});
    $('#ul').innerHTML=U.map(function(x,i){return '<div class="row"><div>'+esc(x.full_name)+(x.active==='Y'?'':' <span class="tag">nonaktif</span>')+'<br><small>'+esc(x.email)+' · '+esc(x.role)+(x.role==='SPV'?' · '+esc(x.branches.map(bn).join(', ')||'belum ada cabang'):'')+'</small></div><div>'+(x.role==='SPV'?'<button data-k="b" data-i="'+i+'">Cabang</button> ':'')+'<button class="gray" data-k="p" data-i="'+i+'">Reset PW</button> '+(x.user_id===ME.user_id?'':'<button class="'+(x.active==='Y'?'red':'')+'" data-k="a" data-i="'+i+'">'+(x.active==='Y'?'Nonaktifkan':'Aktifkan')+'</button>')+'</div></div>'}).join('');
    document.querySelectorAll('#ul button').forEach(function(b){b.onclick=function(){var x=U[b.dataset.i],k=b.dataset.k;
      if(k==='b'){$('#bp').innerHTML='<hr><b>Cabang untuk '+esc(x.full_name)+'</b><select id="bsel" multiple size="5">'+M.branches.map(function(c){return '<option value="'+esc(c.branch_id)+'"'+(x.branches.indexOf(c.branch_id)>=0?' selected':'')+'>'+esc(c.name)+'</option>'}).join('')+'</select><button id="bsv">Simpan Cabang</button>';
        $('#bsv').onclick=function(){run(call('setSpvBranches',{user_id:x.user_id,branches:[].slice.call($('#bsel').selectedOptions).map(function(o){return o.value})}),'Cabang disimpan').then(function(){$('#bp').innerHTML='';load()})}}
      else if(k==='p'){var p=prompt('Password baru untuk '+x.full_name+' (min 8 karakter)');if(p)run(call('resetPassword',{user_id:x.user_id,pw:p}),'Password direset')}
      else run(call('setUserActive',{user_id:x.user_id,active:x.active==='Y'?'N':'Y'}),'Diperbarui').then(load)}});
  })}
  $('#us').onclick=function(){run(call('addUser',{full_name:$('#un').value,email:$('#ue').value,password:$('#up').value,role:$('#ur').value,branches:[].slice.call($('#ub').selectedOptions).map(function(o){return o.value})}),'Akun dibuat').then(load)};
  load();
},
abs:function(){
  var p=function(n){return ('0'+n).slice(-2)},t=new Date(),td=t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate()),first=1;
  var cs=M.codes.filter(function(c){return c.active==='Y'&&c.code!=='H'});
  $('#v').innerHTML='<div class="card"><b>Absensi Harian</b><input id="ad" type="date" value="'+td+'"><button id="ab">Lihat</button><p id="as"></p><div id="al"></div></div><div class="card"><b>Isi Kode Ketidakhadiran</b><br><small>Untuk karyawan yang tidak Clock In (cuti, sakit, dll). Arti kode diatur di menu Cabang &amp; Jabatan.</small><select id="le"></select><input id="lt" type="date" value="'+td+'"><select id="lc">'+cs.map(function(c){return '<option value="'+esc(c.code)+'">'+esc(c.code)+(c.meaning?' - '+esc(c.meaning):'')+'</option>'}).join('')+'</select><input id="ln" placeholder="Catatan (boleh kosong)"><button id="lv">Simpan Kode</button> <button class="red" id="lx">Hapus Kode di Tanggal Itu</button></div>';
  function load(){run(call('attDay',{date:$('#ad').value})).then(function(r){if(!r)return;var c={};
    r.rows.forEach(function(x){var k=x.code||'Belum';c[k]=(c[k]||0)+1});
    $('#as').innerHTML=Object.keys(c).map(function(k){return '<span class="tag">'+esc(k)+': '+c[k]+'</span>'}).join(' ')+' <small>dari '+r.rows.length+' karyawan aktif</small>';
    $('#al').innerHTML=r.rows.map(function(x){return '<div class="row"><div>'+esc(x.full_name)+'<br><small>'+esc(x.branch)+(x.time?' · '+esc(x.time):'')+'</small></div><span class="tag">'+esc(x.code||'Belum')+'</span></div>'}).join('')||'<small>Belum ada karyawan</small>';
    if(first){first=0;$('#le').innerHTML=opts(r.rows,'employee_id','full_name')}
  })}
  function lv(code){run(call('addLeave',{employee_id:$('#le').value,date:$('#lt').value,code:code,note:$('#ln').value}),'Tersimpan').then(load)}
  $('#ab').onclick=load;$('#lv').onclick=function(){lv($('#lc').value)};$('#lx').onclick=function(){lv('')};
  load();
},
rep:function(){
  var t=new Date(),p=function(n){return ('0'+n).slice(-2)},td=t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate()),R=null,L={};
  $('#v').innerHTML='<div class="card"><b>Filter Laporan</b><label><small>Dari</small></label><input id="rf" type="date" value="'+td.slice(0,8)+'01"><label><small>Sampai</small></label><input id="rt" type="date" value="'+td+'"><label><small>Cabang (kosong = semua; bisa pilih banyak)</small></label><select id="rb" multiple size="4">'+opts(M.branches,'branch_id','name')+'</select><select id="rp"><option value="">Semua jabatan</option>'+opts(M.positions,'position_id','name')+'</select><select id="re"><option value="">Semua karyawan</option></select><button id="rs">Tampilkan</button> <button id="rx" class="gray">Excel</button> <button id="rd" class="gray">PDF</button></div><div class="card" style="overflow-x:auto" id="rv"><small>Tekan Tampilkan</small></div>';
  run(call('employees')).then(function(r){if(r)$('#re').innerHTML+=opts(r,'employee_id','full_name')});
  function lib(u){return L[u]||(L[u]=new Promise(function(ok,no){var s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=function(){delete L[u];no(new Error('Gagal memuat pustaka export (cek internet)'))};document.head.appendChild(s)}))}
  function tb(){var dy=R.dates.map(function(x){return x.slice(8)});return {n:dy.length,dy:dy,body:R.rows.map(function(r){return [r.homebase,r.employee_id,r.name,r.position,r.keterangan].concat(r.att,r.ot,[r.total])})}}
  function fn(e){return 'Laporan_SOZO_'+$('#rf').value+'_sd_'+$('#rt').value+'.'+e}
  function ok(){if(R&&R.rows.length)return 1;toast('Tampilkan laporan dulu (data harus ada)',1);return 0}
  var FX=['Homebase','Employee ID','Full Name','Jabatan','Keterangan'];
  $('#rs').onclick=function(){run(call('report',{from:$('#rf').value,to:$('#rt').value,branches:[].slice.call($('#rb').selectedOptions).map(function(o){return o.value}),position_id:$('#rp').value,employee_id:$('#re').value})).then(function(r){
    if(!r)return;R=r;if(!r.rows.length){$('#rv').innerHTML='<small>Tidak ada karyawan sesuai filter</small>';return}
    var x=tb(),h='<table class="rp"><tr>'+FX.map(function(c){return '<th rowspan="2">'+c+'</th>'}).join('')+'<th colspan="'+x.n+'">Hari Kerja</th><th colspan="'+x.n+'">Overtime</th><th rowspan="2">Total OT</th></tr><tr>'+x.dy.concat(x.dy).map(function(d){return '<th>'+d+'</th>'}).join('')+'</tr>';
    x.body.forEach(function(r){h+='<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>'}).join('')+'</tr>'});
    $('#rv').innerHTML=h+'</table>';})};
  $('#rx').onclick=function(){if(!ok())return;run(lib('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js')).then(function(){
    if(!window.XLSX)return;var x=tb(),z=function(n){return Array(Math.max(n,0)).fill('')};
    var h1=FX.concat(['Hari Kerja'],z(x.n-1),['Overtime'],z(x.n-1),['Total OT']),h2=z(5).concat(x.dy,x.dy,['']);
    var ws=XLSX.utils.aoa_to_sheet([h1,h2].concat(x.body));
