rep:function(){
  var t=new Date(),p=function(n){return ('0'+n).slice(-2)},td=t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate()),R=null,L={};
  $('#v').innerHTML='<div class="card"><b>Filter Laporan</b><small style="display:block;margin-top:8px">Dari</small><input id="rf" type="date" value="'+td.slice(0,8)+'01"><small>Sampai</small><input id="rt" type="date" value="'+td+'"><small>Cabang (kosong = semua; bisa pilih banyak)</small><select id="rb" multiple size="4">'+opts(M.branches,'branch_id','name')+'</select><select id="rp"><option value="">Semua jabatan</option>'+opts(M.positions,'position_id','name')+'</select><select id="re"><option value="">Semua karyawan</option></select><button id="rs">Tampilkan</button> <button id="rx" class="gray">Excel</button> <button id="rd" class="gray">PDF</button></div><div class="card tw" id="rv"><small>Tekan Tampilkan</small></div>';
  run(call('employees')).then(function(r){if(r)$('#re').innerHTML+=opts(r,'employee_id','full_name')});
  function lib(u){return L[u]||(L[u]=new Promise(function(ok,no){var s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=function(){delete L[u];no(new Error('Gagal memuat pustaka export (cek internet)'))};document.head.appendChild(s)}))}
  function tb(){var n=R.dates.length,K=R.codes.length;return {n:n,K:K,dy:R.dates.map(function(x){return String(Number(x.slice(8)))}),body:R.rows.map(function(r){return [r.homebase,r.employee_id,r.name,r.position].concat(r.att,r.counts,r.ot,[r.total])})}}
  function fn(e){return 'Absensi_SOZO_'+$('#rf').value+'_sd_'+$('#rt').value+'.'+e}
  function ok(){if(R&&R.rows.length)return 1;toast('Tampilkan laporan dulu (data harus ada)',1);return 0}
  var FX=['Homebase','Employee ID*','Full Name','Jabatan'];
  $('#rs').onclick=function(){run(call('report',{from:$('#rf').value,to:$('#rt').value,branches:[].slice.call($('#rb').selectedOptions).map(function(o){return o.value}),position_id:$('#rp').value,employee_id:$('#re').value})).then(function(r){
    if(!r)return;R=r;if(!r.rows.length){$('#rv').innerHTML='<small>Tidak ada karyawan sesuai filter</small>';return}
    var x=tb(),h='<table class="rp"><tr><th class="g1 l" colspan="4">Keterangan</th><th class="g2 l" colspan="'+(x.n+x.K)+'">Hari Kerja</th><th class="g3 l" colspan="'+(x.n+1)+'">Overtime</th></tr><tr>'+FX.map(function(c){return '<th class="h1 l">'+c+'</th>'}).join('')+x.dy.map(function(d){return '<th class="ho">'+d+'</th>'}).join('')+R.codes.map(function(c){return '<th class="ho">'+esc(c)+'</th>'}).join('')+x.dy.map(function(d){return '<th class="hy">'+d+'</th>'}).join('')+'<th class="ho">OT</th></tr>';
    x.body.forEach(function(r){h+='<tr>'+r.map(function(c,i){return '<td class="'+(i<4?'l':(i>=4+x.n&&i<4+x.n+x.K)||i===r.length-1?'cn':'')+'">'+esc(c)+'</td>'}).join('')+'</tr>'});
    $('#rv').innerHTML=h+'</table>';})};
  $('#rx').onclick=function(){if(!ok())return;run(lib('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js')).then(function(){
    if(!window.ExcelJS)return;var x=tb(),tot=4+2*x.n+x.K+1,wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Absensi');
    var r1=Array(tot).fill('');r1[0]='Keterangan';r1[4]='Hari Kerja';r1[4+x.n+x.K]='Overtime';
    ws.addRow(r1);ws.addRow(FX.concat(x.dy,R.codes,x.dy,['OT']));x.body.forEach(function(r){ws.addRow(r)});
    ws.mergeCells(1,1,1,4);ws.mergeCells(1,5,1,4+x.n+x.K);ws.mergeCells(1,5+x.n+x.K,1,tot);
    function fl(c,hex){c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF'+hex}}}
    var bd={style:'thin',color:{argb:'FF808080'}};
    ws.eachRow(function(row,ri){row.eachCell({includeEmpty:true},function(c,ci){
      c.border={top:bd,left:bd,bottom:bd,right:bd};c.font={size:ri<3?10:9,bold:ri===2||(ri>2&&((ci>4+x.n&&ci<=4+x.n+x.K)||ci===tot))};
      c.alignment={horizontal:ci<=4?'left':'center',vertical:'middle'};
      if(ri===1)fl(c,ci<=4?'B4C6E7':ci<=4+x.n+x.K?'F4B084':'FFE699');
      else if(ri===2)fl(c,ci<=4?'8EA9DB':(ci>4+x.n+x.K&&ci<tot)?'FFE699':'F8CBAD');
      else if((ci>4+x.n&&ci<=4+x.n+x.K)||ci===tot)fl(c,'F8CBAD');
    })});
    [26,14,34,16].forEach(function(w,i){ws.getColumn(i+1).width=w});for(var i=5;i<=tot;i++)ws.getColumn(i).width=4.8;
    return wb.xlsx.writeBuffer().then(function(buf){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download=fn('xlsx');a.click();toast('Excel diunduh')})})};
  $('#rd').onclick=function(){if(!ok())return;run(lib('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js').then(function(){return lib('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js')})).then(function(){
    if(!window.jspdf)return;var x=tb(),d=new window.jspdf.jsPDF({orientation:'landscape',format:x.n<=12?'a4':x.n<=31?'a3':'a2'}),B=[180,198,231],B2=[142,169,219],O=[244,176,132],O2=[248,203,173],Y=[255,230,153];
    function c(t,col,sp){var o={content:String(t),styles:{fillColor:col,textColor:0,fontStyle:'normal',halign:'center'}};if(sp)o.colSpan=sp;return o}
    var h1=[c('Keterangan',B,4),c('Hari Kerja',O,x.n+x.K),c('Overtime',Y,x.n+1)],h2=FX.map(function(t){return c(t,B2)}).concat(x.dy.map(function(t){return c(t,O2)}),R.codes.map(function(t){return c(t,O2)}),x.dy.map(function(t){return c(t,Y)}),[c('OT',O2)]);
    h1.forEach(function(o,i){if(i===0)o.styles.halign='left'});
    d.autoTable({startY:12,margin:8,theme:'grid',styles:{fontSize:6.5,cellPadding:1,textColor:0,lineColor:[120,120,120],lineWidth:.1,halign:'center'},head:[h1,h2],body:x.body,
      columnStyles:{0:{halign:'left'},1:{halign:'left'},2:{halign:'left'},3:{halign:'left'}},
      didParseCell:function(e){if(e.section==='body'){var i=e.column.index;if((i>=4+x.n&&i<4+x.n+x.K)||i===4+2*x.n+x.K){e.cell.styles.fillColor=O2;e.cell.styles.fontStyle='bold'}}}});
    d.save(fn('pdf'));toast('PDF diunduh')})};
},

function startAuth(){auth.onAuthStateChanged(function(u){
  if(!u){UD=null;ME=null;return showLogin()}
  var em=(u.email||'').toLowerCase();
  if(!u.emailVerified)return showVerify(u);
  tmo(col('users').doc(em).get(),20000).then(function(s){var d=s.exists&&s.data();
    if(!d)return showSignup(u,em);
    if(d.active!=='Y'){auth.signOut();toast('Akun nonaktif. Hubungi admin.',1);return}
    UD=d;UD.email=em;boot()
  }).catch(function(e){auth.signOut();toast(e.code==='permission-denied'?'Akses ditolak (cek Firestore Rules)':e.message,1)})
})}

  function Q(r){return {where:function(f,o,v){return Q(F.query(r,F.where(f,o,v)))},get:function(){return F.getDocs(r).then(function(s){return {docs:s.docs.map(function(d){return {id:d.id,data:function(){return d.data()}}})}})}}}
  db={collection:function(n){var c=F.collection(fdb,n),q=Q(c);return {doc:function(id){var r=F.doc(fdb,n,id);return {_r:r,get:function(){return F.getDoc(r).then(function(s){return {exists:s.exists(),data:function(){return s.data()}}})},set:function(v){return F.setDoc(r,v)},update:function(v){return F.updateDoc(r,v)},delete:function(){return F.deleteDoc(r)}}},where:q.where,get:q.get,add:function(v){return F.addDoc(c,v)}}},
